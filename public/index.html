      <button class=${'nav'+(v==='tasks'&&!openProj?' sel':'')} onClick=${function(){setView2('tasks');}}><span style=${{display:'flex',color:v==='tasks'&&!openProj?'var(--accent-deep)':'#54606E'}}><${Icon}>${icons.tasks}<//></span>Tasks<span class="cnt">${(tasks||[]).filter(function(t){return !t.done;}).length||''}</span></button>
      <button class=${'nav'+(v==='calendar'&&!openProj?' sel':'')} onClick=${function(){setView2('calendar');}}><span style=${{display:'flex',color:v==='calendar'&&!openProj?'var(--accent-deep)':'#54606E'}}><${Icon}>${icons.calendar}<//></span>Calendar</button>
      <button class=${'nav'+(v==='projects'||openProj?' sel':'')} onClick=${function(){setView2('projects');}}><span style=${{display:'flex',color:v==='projects'||openProj?'var(--accent-deep)':'#54606E'}}><${Icon}>${icons.projects}<//></span>Projects</button>
      <button class=${'nav'+(v==='journal'&&!openProj?' sel':'')} onClick=${function(){setView2('journal');}}><span style=${{display:'flex',color:v==='journal'&&!openProj?'var(--accent-deep)':'#54606E'}}><${Icon}>${icons.journal}<//></span>Journal</button>
      <div class="sec">Projects</div>
      ${(projects||[]).filter(function(p){return !p.archived;}).map(function(p){ return html`<button class="nav" key=${p.id} onClick=${function(){setPanel(p.id);}}><span class="dot" style=${{background:p.color}}></span>${p.name}<span class="cnt">${projCounts[p.id]||''}</span></button>`; })}
      <button class="nav" style=${{color:'var(--accent-deep)',fontWeight:600}} onClick=${function(){setPEdit({});}}>+ New project</button>
      <${FocusWidget} focus=${focus} whoami=${whoami} onStart=${startFocus} onPause=${pauseFocus} onResume=${resumeFocus} onReset=${resetFocus} />
      <button class="helpbtn" onClick=${function(){setShowIntro(true);}}><span style=${{display:'flex',color:'#54606E'}}><${Icon}>${icons.help}<//></span>How it works</button>
      <button class="nav" onClick=${function(){setSettingsOpen(true);}}><span style=${{display:'flex',color:'#54606E'}}><${Icon}>${icons.settings}<//></span>Settings</button>
      <div class="sfoot">${VIEW.members.slice(0,3).map(function(m,k){ return html`<span key=${m} class="av avm" style=${{background:personColor(m),marginLeft:k?'-8px':0,border:k?'2px solid var(--sidebar)':'0'}}>${initialOf(m)}</span>`; })}${syncTxt?html`<span class=${'syncln '+sync.st} role="status"><i class="syncdot"></i>${syncTxt}${sync.st==='error'?html` · <button class="linkbtn" onClick=${retryNow}>Retry</button>`:null}</span>`:html`<span style=${{fontWeight:500,fontSize:'12px',color:'#8A93A0',marginLeft:'4px'}}>hate club</span>`}</div>
    </aside>`;

    var titleTxt = openProj?'Projects':(({today:'Today',week:'This week',tasks:'Tasks',calendar:'Calendar',projects:'Projects',journal:'Journal'})[v]||'Today');
    // Today header: a functional + empathetic greeting (name · time of day · what's next), daily-rotating so it stays fresh
    var greet=(function(){
      var name=((nameOf(whoami)||'').trim().split(/\s+/)[0])||'you';
      var h=new Date().getHours();
      var tod=h<5?'night':h<12?'morning':h<17?'afternoon':h<22?'evening':'night';
      var n=counts.today;
      var carried=carriedFrom(tasks,function(){return true;});
      var todayList=(tasks||[]).filter(function(t){return !t.parent_id&&t.date===TODAY&&!t.done&&!isEventType(t.type);});
      var top=carried[0]||todayList[0];
      var topT=top?((top.title||'').trim()):'';
      var doneToday=(tasks||[]).filter(function(t){return !t.parent_id&&t.date===TODAY&&t.done;}).length;
      var d=parseYmd(TODAY), eb=DOW[d.getDay()]+' · '+d.getDate()+' '+MON[d.getMonth()].slice(0,3);
      var vary=parseInt(TODAY.replace(/-/g,''),10)%2, hook, sub;
      if(n===0&&doneToday===0){ hook=vary?('A clear day, '+name):('Nothing on today, '+name); sub='Add something when you like — or enjoy the quiet.'; }
      else if(n===0){ hook=vary?('That’s the lot, '+name+' ✨'):('Done for the day, '+name+' 🎉'); sub='Everything for today is ticked off.'; }
      else {
        var g={morning:['Morning, '+name, name+', let’s get into it'],
               afternoon:['Afternoon, '+name, name+', keep it rolling'],
               evening:['Evening, '+name, name+', let’s close the day'],
               night:['Still up, '+name+'?', name+', one more push?']};
        hook=g[tod][vary];
        if(carried.length){ sub=vary?html`${carried.length} rolled over — start with “<b>${topT}</b>”`:html`${carried.length} from earlier still open · first “<b>${topT}</b>”`; }
        else if(topT){ sub=vary?html`Let’s finish “<b>${topT}</b>” first — ${n} to go`:html`${n} on the list · kick off with “<b>${topT}</b>”`; }
        else sub=n+' to go today';
      }
      return {eb:eb, hook:hook, sub:sub};
    })();
    var content;
    if(loading){ content=html`<div class="empty" style=${{marginTop:'60px',color:'var(--accent-muted)'}}><div class="big">${sync.st==='offline'?'Can’t reach the server':'Loading your planner…'}</div><div class="sub">${sync.st==='offline'?'Trying again in a few seconds.':'Syncing shared data.'}</div></div>`; }
    else if(openProj){ content=html`<${ProjectPage} key=${openProj.id} project=${openProj} tasks=${tasks} materials=${materials} onBack=${function(){setPanel(null);}} onToggle=${toggleTask} onEdit=${function(p){setPEdit(p);}} onEditTask=${function(t){setModal({editing:t});}} onAddItem=${addProjectItem} onAddSub=${addSubtask} onAddMaterial=${addMaterial} onDelMaterial=${delMaterial} onReopen=${reopenProject} onFinish=${finishProject} />`; }
    else if(v==='week'){ content=html`<${WeekPage} fresh=${!!leadFlash} data=${wkData} projects=${projects} onToggle=${toggleTask} onTakeOne=${takeOne} onCheer=${function(){ sendWave('💪'); }} />`; }
    else if(v==='today'){ content=html`<${Fragment}>${showGS?html`<${GetStarted} steps=${gsSteps} done=${gsDone} onDismiss=${function(){setGsHide(true);lsSet('sp_gs_hide','1');}} />`:null}<div class="mobfocus"><${FocusWidget} focus=${focus} whoami=${whoami} onStart=${startFocus} onPause=${pauseFocus} onResume=${resumeFocus} onReset=${resetFocus} /></div><${Today} sel=${sel} filter=${filter} projects=${projects} tasks=${tasks} routines=${routines} upcoming=${upcoming} habits=${habitDefs} habitLogs=${habitLogs} topics=${topics} topicLinks=${topicLinks} settings=${settings} whoami=${whoami} onToggle=${toggleTask} onEdit=${function(t){setModal({editing:t});}} onAdd=${function(d){setModal({defaultDate:d});}} carry=${carry} onMoveAllToday=${moveAllToday} onSetHabit=${checkHabit} onStepHabit=${stepHabit} onEditHabit=${function(h){setHabitEdit(h);}} onAddHabit=${function(){setHabitEdit({});}} notes=${notes} onAddNote=${addNote} onSaveNote=${saveNoteText} onSetNoteColor=${setNoteColor} onDeleteNote=${deleteNote} onGoJournal=${function(){setView2('journal');}} onShowAll=${function(){setView2('tasks');}} onImport=${function(){setImport({});}} importCount=${importable} streak=${usk} repair=${uskRepair} onCover=${coverToday} onRepair=${repairStreak} partner=${partner} nudged=${nudgedToday} onNudge=${sendNudge} onBoost=${sendBoost} dailyAnswers=${dailyAnswers} onAnswer=${answerDaily} score=${thisWeek} help=${helpFor} fresh=${!!leadFlash} onOpenWeek=${function(){setView2('week');}} onQuickAdd=${quickAdd} /><//>`; }
    else if(v==='tasks'){ content=html`<${TasksTable} tasks=${tasks} projects=${projects} onEdit=${function(t){setModal({editing:t});}} onToggle=${toggleTask} />`; }
    else if(v==='calendar'){ content=html`<${Calendar} tasks=${tasks} projects=${projects} onAddDay=${function(ds){setModal({defaultDate:ds});}} onAddSlot=${function(ds,tm){setModal({defaultDate:ds,defaultTime:tm,defaultType:'event'});}} onEditTask=${function(t){setModal({editing:t});}} onOpenProject=${function(id){setPanel(id);}} onToggle=${toggleTask} onSchedule=${scheduleTask} onNewProject=${function(s,e){setPEdit({start_date:s,end_date:e});}} routines=${routines} />`; }
    else if(v==='projects'){ content=html`<${Projects} projects=${projects} tasks=${tasks} onOpen=${function(id){setPanel(id);}} onNew=${function(){setPEdit({});}} onEdit=${function(p){setPEdit(p);}} onToggle=${toggleTask} onPickDates=${function(){setView2('calendar');}} />`; }
    // settings is a modal now (opened from the sidebar / mobile tab), not a view.
    else { content=html`<${Journal} entries=${journal} whoami=${whoami} pending=${jPending} offline=${sync.st==='offline'} topics=${topics} topicLinks=${topicLinks} onSave=${saveJournal} onSetTopic=${setWeekTopic} onAddTopicLink=${addTopicLink} onDelTopicLink=${delTopicLink} />`; }

    var navBtns=showScores?['today','week','calendar','projects','more']:['today','calendar','projects','tasks','more'];
    var NAVL={today:'Today',week:'Week',calendar:'Calendar',projects:'Projects',tasks:'Tasks',more:'More'};
    return html`<div class="app">
      ${sidebar}
      <main class="main"><div class="wrap">
        <div class="topbar">
          <div class="brandrow"><span class="brand">hc</span>${v==='today'&&!openProj&&!loading?html`<div class="hgreet"><div class="eyebrow">${greet.eb}</div><h1 class="title">${greet.hook}</h1><div class="hgsub">${greet.sub}</div></div>`:html`<div><div class="eyebrow">hate club</div><h1 class="title">${titleTxt}</h1></div>`}</div>
          <div class="ctrls">
            <button class="navcirc mobonly" style=${{width:'36px',height:'36px'}} aria-label="How it works" onClick=${function(){setShowIntro(true);}}><${Icon} s=${16}>${icons.help}<//></button>
            ${syncTxt?html`<button class=${'syncbtn mobonly '+sync.st} aria-label=${syncTxt} onClick=${function(){ showToast({text:syncTxt,action:sync.st==='error'?{label:'Retry',fn:retryNow}:null,ms:5000}); }}><i class="syncdot"></i><span class="syncw">${sync.st==='offline'?('Offline'+(sync.n?(' · '+sync.n):'')):sync.st==='error'?'Not saved':'Saving'}</span></button>`:null}
            ${v==='today'&&!openProj&&thisWeek?html`<${ScorePill} score=${thisWeek} fresh=${!!leadFlash} onOpen=${function(){setView2('week');}} />`:null}
            ${v==='today'&&!openProj?html`<div class="seg" role="group" aria-label="Filter"><button class=${filter==='all'?'on':''} onClick=${function(){setFilter('all');}}>All</button><button class=${filter==='mine'?'on':''} onClick=${function(){setFilter('mine');}}>Mine</button></div>`:null}
            ${v==='projects'&&!openProj?html`<button class="pillbtn" onClick=${function(){setPEdit({});}}>+ New project</button>`:null}
            ${v==='tasks'&&!openProj?html`<button class="pillbtn" onClick=${function(){setModal({defaultDate:TODAY});}}>+ New task</button>`:null}
          </div>
        </div>
        ${v==='today'&&!loading&&!openProj?html`<div class="datesel">
          <button class="navcirc" aria-label="Previous week" onClick=${function(){setSel(ymd(addDays(parseYmd(sel),-7)));}}>${chevL}</button>
          <div class="days">${(function(){var start=startOfWeek(parseYmd(sel));var out=[];for(var i=0;i<7;i++){(function(){var d=addDays(start,i);var ds=ymd(d);out.push(html`<button class="daycell" key=${ds} onClick=${function(){setSel(ds);}}><div class="dletter">${DOWL[d.getDay()]}</div><div class=${'ddisc'+(ds===TODAY?' today':'')+(ds===sel?' sel':'')}>${d.getDate()}</div></button>`);})();}return out;})()}</div>
          <button class="navcirc" aria-label="Next week" onClick=${function(){setSel(ymd(addDays(parseYmd(sel),7)));}}>${chevR}</button>
        </div>`:null}
        ${content}
      </div></main>

      <nav class="mobnav">${navBtns.map(function(k){ var on=k==='more'?(navBtns.indexOf(v)<0&&!openProj):(k==='projects'?(v==='projects'||!!openProj):(v===k&&!openProj)); return html`<button key=${k} class=${on?'on':''} aria-current=${on?'page':null} onClick=${function(){ if(k==='more') setMoreOpen(true); else setView2(k); }}><${Icon} s=${20}>${icons[k]}<//>${NAVL[k]}</button>`; })}</nav>
      ${moreV?html`<${MoreSheet} closing=${moreClosing} onClose=${function(){setMoreOpen(false);}} onPick=${function(k){ setMoreOpen(false); if(k==='settings') setSettingsOpen(true); else if(k==='help') setShowIntro(true); else setView2(k); }} />`:null}

      ${importV?html`<div class="nsov" onClick=${function(e){ if(e.target===e.currentTarget && !importV.busy) setImport(null); }}>
        <div class="nsmodal">
          <div class="meyebrow">Import</div>
          <h3 class="nsh">Bring your tasks into ${curSpaceName}</h3>
          <p class="nssub">Brings your own tasks — with their subtasks and project — into ${curSpaceName}. Your originals stay put, and importing again won't duplicate anything.</p>
          <div class="implist">
            ${otherSpaces.filter(function(sp){return openCountIn(sp.id)>0;}).map(function(sp){ var c=openCountIn(sp.id); return html`<button key=${sp.id} class="improw" disabled=${importV.busy} onClick=${function(){nsImport(sp.id);}}><span class="spacesw-avs">${spaceMembers(sp.id).slice(0,3).map(function(m,k){return html`<span key=${m} class="av avm" style=${{background:personColor(m),marginLeft:k?'-7px':0,border:'2px solid var(--card)'}}>${initialOf(m)}</span>`;})}</span><span class="improw-nm">${sp.name}</span><span class="improw-c">${c} task${c>1?'s':''}</span></button>`; })}
            ${otherSpaces.filter(function(sp){return openCountIn(sp.id)>0;}).length>1?html`<button class="improw improw-all" disabled=${importV.busy} onClick=${function(){nsImport('all');}}><span class="improw-nm">All my spaces</span><span class="improw-c">${importable} task${importable>1?'s':''}</span></button>`:null}
          </div>
          <p class="nssub" style=${{marginTop:'14px',paddingTop:'12px',borderTop:'1px solid var(--line-soft)',fontSize:'12px'}}>Shared work — anything you share with someone, or that lives in their project — stays in its space. To work on it together, add that person to the space instead.</p>
          <div class="mactions" style=${{justifyContent:'flex-end',marginTop:'16px'}}><button class="btn ghost" style=${{flex:'none'}} disabled=${importV.busy} onClick=${function(){setImport(null);}}>${importV.busy?'Importing…':'Cancel'}</button></div>
        </div>
      </div>`:null}
      ${modalV?html`<${TaskModal} closing=${modalClosing} key=${editingTask?editingTask.id:'new'} parent=${editingParent} onOpenParent=${function(p){setModal({editing:p});}} editing=${modalV.editing} children=${modalChildren} defaultDate=${modalV.defaultDate} defaultTime=${modalV.defaultTime} defaultType=${modalV.defaultType} defaultProject=${modalV.defaultProject} whoami=${whoami} projects=${projects} onClose=${function(){setModal(null);}} onSave=${saveTask} onDelete=${deleteTask} />`:null}
      ${pEditV?html`<${ProjectEditor} closing=${pEditClosing} editing=${pEditV} whoami=${whoami} onClose=${function(){setPEdit(null);}} onSave=${saveProject} onDelete=${askDeleteProject} />`:null}
      ${introV?html`<${Intro} closing=${introClosing} onClose=${function(){setShowIntro(false);lsSet('sp_intro_v1','1');}} />`:null}
      ${setV?html`<${SettingsModal} closing=${setClosing} settings=${settings} habits=${habitDefs} whoami=${whoami} themeBg=${(settings&&settings.theme_bg)||'sky'} themeFont=${(settings&&settings.theme_font)||'general'} themeRad=${(settings&&settings.theme_radius)||'default'} onSetTheme=${setTheme} me=${me} members=${VIEW.members} onSaveName=${saveMyName} onChangePassword=${changePassword} onSignOut=${signOut} onAddHabit=${function(){setHabitEdit({});}} onEditHabit=${function(h){setHabitEdit(h);}} onHowItWorks=${function(){setSettingsOpen(false);setShowIntro(true);}} onClose=${function(){setSettingsOpen(false);}} />`:null}
      ${habitV?html`<${HabitEditor} closing=${habitClosing} editing=${habitV.id?habitV:null} whoami=${whoami} onClose=${function(){setHabitEdit(null);}} onSave=${saveHabit} onDelete=${deleteHabit} />`:null}
      ${newSpace?html`<div class="nsov" onClick=${function(e){ if(e.target===e.currentTarget) setNewSpace(null); }}>
        <div class="nsmodal">
          ${newSpace.step==='invite'?html`<${Fragment}>
            <div class="meyebrow">Space</div>
            <h3 class="nsh">Invite your partner</h3>
            <p class="nssub">Send them this link. They open it, make a sign-in, and land straight in <b>${newSpace.name}</b>.</p>
            <div class="nsinvite"><input class="fld" readOnly value=${location.origin+'/?invite='+newSpace.code} onFocus=${function(e){e.target.select();}} /><button class="btn primary" style=${{flex:'none'}} onClick=${function(e){ var u=location.origin+'/?invite='+newSpace.code, b=e.currentTarget; try{navigator.clipboard.writeText(u);}catch(x){} b.textContent='Copied'; setTimeout(function(){ try{b.textContent='Copy';}catch(y){} },1400); }}>Copy</button></div>
            <div class="nscode">or share the code <b>${newSpace.code}</b></div>
            <div class="mactions" style=${{justifyContent:'flex-end',marginTop:'18px'}}><button class="btn primary" style=${{flex:'none'}} onClick=${function(){ setNewSpace(null); }}>Done</button></div>
          <//>`:html`<${Fragment}>
            <div class="meyebrow">New space</div>
            <h3 class="nsh">Start a space</h3>
            <p class="nssub">A fresh shared world — its own tasks, habits and race. Name it, then invite one person.</p>
            <input class="fld" autoFocus value=${newSpace.name} placeholder="e.g. Mahesh & Riya" onInput=${function(e){ setNewSpace(Object.assign({},newSpace,{name:e.target.value,err:''})); }} onKeyDown=${function(e){ if(e.key==='Enter') nsCreate(); }} />
            ${newSpace.err?html`<${AuthError} text=${newSpace.err} />`:null}
            <div class="mactions" style=${{justifyContent:'flex-end',marginTop:'16px'}}><button class="btn ghost" style=${{flex:'none'}} onClick=${function(){ setNewSpace(null); }}>Cancel</button><button class="btn primary" style=${{flex:'none'}} disabled=${newSpace.busy} onClick=${nsCreate}>${newSpace.busy?'Creating…':'Create'}</button></div>
          <//>`}
        </div>
      </div>`:null}
      ${!loading?html`<div class="wavewrap">
        ${waveOpen?html`<div class="wavepick">${WAVE_EMOJIS.map(function(e){ return html`<button class="waveopt" key=${e} onClick=${function(){sendWave(e);}}>${e}</button>`; })}</div>`:null}
        <button class="wavefab" aria-label=${'Send a wave to '+nameOf(other)} title=${'Wave to '+nameOf(other)} onClick=${function(){setWaveOpen(!waveOpen);}}>🫶</button>
      </div>`:null}
      ${toastV?html`<div class=${'toast'+(toastV.big?' big':'')+(toastClosing?' closing':'')} key=${toastV.t} role="status">${toastV.emoji?html`<span class="toast-emoji">${toastV.emoji}</span>`:null}<span>${toastV.text}</span>${toastV.action?html`<button class="toast-act" onClick=${function(){ var a=toastV.action; clearTimeout(toastTmr.current); setToast(null); a.fn(); }}>${toastV.action.label}</button>`:null}</div>`:null}
      ${confirmV?html`<${ConfirmModal} closing=${confirmClosing} title=${confirmV.title} body=${confirmV.body} confirmLabel=${confirmV.confirmLabel} alt=${confirmV.alt} onConfirm=${confirmV.onConfirm} onClose=${function(){setConfirm(null);}} />`:null}
      ${toast&&toast.big?html`<div class="wavefx" key=${'fx'+toast.t}>${toast.emoji}</div>`:null}
      ${toast&&toast.big?[-96,-54,-18,18,54,96].map(function(dx,i){ return html`<span class="wpart" key=${'wp'+toast.t+i} style=${{'--dx':dx+'px',animationDelay:(120+i*70)+'ms'}} aria-hidden="true">${toast.emoji}</span>`; }):null}
    </div>`;
  }

  render(h(App), document.getElementById('root'));
})();
</script>
</body>
</html>
