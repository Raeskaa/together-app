<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCEBFF">
<title>hate club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">
<style>
/* Calm sky system: soft blue->white gradient pane + ink/blue accents, Todoist-style shell. Single light theme by choice. */
:root{
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-move:cubic-bezier(.645,.045,.355,1); --ease-pop:cubic-bezier(.34,1.56,.64,1);
  --ink:#15171A; --body:#2B2F36; --muted:#5A616B; --faint:#878F9B; --fainter:#AEB6C1;
  --line:#E7ECF2; --line-soft:#EEF2F7; --field:#D7DEE7;
  --sidebar:#F7FAFE; --card:#FFFFFF; --wash:#EFF4FA;
  --accent:#1F6FEB; --accent-deep:#195FD0; --accent-wash:#E8F1FF;
  --glow:rgba(31,111,235,.22); --glass:rgba(255,255,255,.60); --glass-line:rgba(255,255,255,.72); --dot:#CBD5E3; --radius-sheet:22px;
  --accent-muted:color-mix(in srgb, var(--accent-deep) 60%, #8A93A0);
  --primary:var(--accent-deep);
  --me:#15171A; --partner:#5B6B86; --shared:#B4792B;
  --grad:
    radial-gradient(1100px 760px at 78% 12%, rgba(255,255,255,.9), transparent 60%),
    radial-gradient(900px 680px at 12% 82%, rgba(255,255,255,.5), transparent 55%),
    linear-gradient(162deg,#3FA0FF 0%,#6FBAFF 20%,#A6D5FF 40%,#D6ECFF 62%,#F5FAFF 85%);
  --font:'General Sans','Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:#EAF3FF;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit}
#root{height:100%}
.app{display:flex;height:100%;overflow:hidden;background:var(--grad)}

/* sidebar */
.sidebar{width:242px;flex:none;background:transparent;border-right:none;padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.prof{display:flex;align-items:center;gap:9px;padding:4px 6px 12px}
.pav{width:30px;height:30px;border-radius:999px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#fff));color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.pname{font-weight:600;font-size:14.5px}
.addbtn{display:flex;align-items:center;gap:10px;background:none;border:none;padding:8px;font-weight:600;font-size:14px;color:var(--accent-deep);cursor:pointer;border-radius:8px;width:100%;text-align:left}
.addbtn:hover{background:var(--accent-wash)}
/* space switcher (sidebar top) */
.spacesw{position:relative;margin-bottom:12px}
.spacesw-btn{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:none;background:none;border-radius:10px;cursor:pointer;text-align:left}
.spacesw-btn:hover{background:var(--accent-wash)}
.spacesw-nm{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.spacesw-nm b{font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacesw-nm i{font-style:normal;font-weight:500;font-size:11px;color:var(--muted)}
.spacesw-cv{color:var(--faint);font-size:11px;flex:none}
.spacesw-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px -12px rgba(20,40,80,.28);padding:6px}
.spacesw-op{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:none;background:none;border-radius:8px;cursor:pointer;text-align:left;font:inherit}
.spacesw-op:hover,.spacesw-op.on{background:var(--accent-wash)}
.spacesw-avs{display:flex;flex:none}
.spacesw-opnm{flex:1;font-weight:500;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacesw-ck{color:var(--accent-deep);font-weight:700;flex:none}
.spacesw-add{display:block;width:100%;text-align:left;padding:8px 9px;margin-top:4px;border:none;border-top:1px solid var(--line-soft);background:none;color:var(--accent-deep);font-weight:600;font-size:13px;cursor:pointer;border-radius:0 0 8px 8px}
.spacesw-add:hover{background:var(--accent-wash)}
.nsov{position:fixed;inset:0;background:rgba(16,38,77,.22);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;animation:fadein .2s var(--ease-out)}
.nsmodal{width:440px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sheet);box-shadow:0 28px 80px rgba(16,40,82,.3);padding:22px 24px 20px;animation:slidein .2s var(--ease-out)}
.nsh{margin:2px 0 0;font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--ink)}
.nssub{margin:7px 0 16px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.nsinvite{display:flex;gap:8px}
.nscode{margin-top:12px;font-size:12.5px;color:var(--muted)}
.nscode b{font-weight:700;color:var(--body);letter-spacing:.04em}
.implist{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.improw{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font:inherit;text-align:left}
.improw:hover:not(:disabled){background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 28%,var(--line))}
.improw:disabled{opacity:.6;cursor:default}
.improw-nm{flex:1;font-weight:600;font-size:14px;color:var(--ink)}
.improw-c{font-weight:500;font-size:12.5px;color:var(--muted)}
.improw-all{border-style:dashed}
.nav{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:8px;font-weight:500;font-size:14px;color:#2F343B;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav:hover{background:#EDF2F8}
.nav.sel{background:var(--card);color:var(--accent-deep);font-weight:600;box-shadow:0 1px 3px rgba(25,45,90,.12)}
.cnt{margin-left:auto;font-weight:500;font-size:12px;color:#9AA3AF}
.nav.sel .cnt{color:var(--accent-deep)}
.sec{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9AA3AF;padding:12px 10px 4px}
.dot{width:9px;height:9px;border-radius:999px;flex:none}
.sfoot{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid #E5EAF1}
/* dark app-ground variant (floating white canvas on a dark ground) */
#root[data-ground="dark"] .sidebar{color:#DCE2EC}
#root[data-ground="dark"] .nav{color:#C7CFDD}
#root[data-ground="dark"] .nav:hover{background:rgba(255,255,255,.07)}
#root[data-ground="dark"] .nav:not(.sel) > span:first-child{color:#C2CBDA !important}
#root[data-ground="dark"] .cnt{color:#8A94A6}
#root[data-ground="dark"] .sec{color:#8792A4}
#root[data-ground="dark"] .pname{color:#EDEFF4}
#root[data-ground="dark"] .addbtn{color:#8FB8FF}
#root[data-ground="dark"] .addbtn:hover{background:rgba(255,255,255,.07)}
#root[data-ground="dark"] .helpbtn{color:#C7CFDD}
#root[data-ground="dark"] .helpbtn:hover{background:rgba(255,255,255,.07)}
#root[data-ground="dark"] .helpbtn > span:first-child{color:#C2CBDA !important}
#root[data-ground="dark"] .sfoot{border-top-color:rgba(255,255,255,.12)}
#root[data-ground="dark"] .sfoot span[style]{color:#AEB6C4 !important}
.av{border-radius:999px;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}

/* main */
.main{flex:1;min-width:0;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 10px 10px 4px;box-shadow:0 1px 3px rgba(25,45,90,.06),0 18px 38px -24px rgba(25,45,90,.24)}
.wrap{max-width:1000px;margin:0 auto;padding-block:28px 80px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brandrow{display:flex;align-items:center;gap:13px}
.brand{width:42px;height:42px;border-radius:12px;background:#15171A;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.eyebrow{font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-muted)}
h1.title{margin:2px 0 0;font-weight:700;font-size:29px;letter-spacing:-.02em;color:#15171A}
.hgsub{margin-top:5px;font-weight:500;font-size:13.5px;line-height:1.4;color:var(--muted);max-width:44ch}
.hgsub b{font-weight:600;color:var(--body)}
.ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:3px;box-shadow:0 1px 2px rgba(30,70,140,.06)}
.seg button{border:none;background:none;border-radius:999px;padding:6px 13px;font-weight:500;font-size:12.5px;color:#3A4350;cursor:pointer}
.seg button.on{background:#fff;color:#15171A;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pillbtn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.8);border-radius:999px;padding:8px 13px;font-weight:600;font-size:13px;color:#2F343B;cursor:pointer}

/* date selector (Today) */
.datesel{display:flex;align-items:center;gap:6px;margin-top:24px}
.navcirc{width:38px;height:38px;border-radius:999px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.55);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daycell{text-align:center;background:none;border:none;cursor:pointer;padding:0}
.dletter{font-weight:500;font-size:12px;color:var(--accent-muted);margin-bottom:8px}
.ddisc{margin:0 auto;width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:16px;color:#2B3440}
.ddisc.today{color:var(--accent-deep);font-weight:700}
.ddisc.sel{background:#fff;box-shadow:0 2px 8px rgba(40,90,160,.18);border-color:transparent}

/* chips */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:7px 14px;font-weight:500;font-size:13px;color:#2F343B}
.chip b{font-weight:700}
.chip .sub{color:#8A93A0}
.upnext{margin-top:22px}
.upeyebrow{font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7E8894;margin:0 2px 9px}
.upnext .chips{margin-top:0}
.showalllink{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;color:var(--accent-deep);cursor:pointer;padding:6px 4px;white-space:nowrap}
.showalllink:hover{text-decoration:underline}
/* tasks table view */
.tvbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:22px}
.tsel{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px;font-weight:500;color:#2F343B;background:var(--card);cursor:pointer}
.tvcount{margin-left:auto;font-size:12.5px;color:#9AA3AF;font-weight:500}
.tvtable{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.tvghd{display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--wash);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8A93A0;border-top:1px solid var(--line)}
.tvghd:first-child{border-top:none}
.tvghd span{font-size:11px;color:#AEB6C1}
.tvrow{display:flex;align-items:center;gap:13px;padding:11px 16px;border-top:1px solid var(--line-soft);cursor:pointer}
.tvrow:hover{background:#F6F8FB}
.tvc1{flex:none;width:20px;display:flex;align-items:center;justify-content:center}
.tvev{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7A5BD8}
.tvttl{flex:1;min-width:0;font-size:14px;color:#15171A;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tvttl.done{color:#AEB6C1;text-decoration:line-through}
.tvproj{display:flex;align-items:center;gap:6px;font-size:12px;color:#8A93A0;flex:none;max-width:160px}
.tvpn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tvproj.none{color:#C7CDD6}
.tvdue{font-size:12px;color:#8A93A0;font-weight:500;flex:none;width:120px;text-align:right;font-variant-numeric:tabular-nums}
.tvdue.over{color:#C2704B;font-weight:600}
@media(max-width:620px){.tvproj{display:none}.tvdue{width:auto;min-width:64px}}

/* cards / agenda */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 3px rgba(30,70,140,.05)}
.agenda{margin-top:26px;padding:4px 22px 8px}
.cardhd{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 6px}
.cardhd h2{margin:0;font-weight:700;font-size:16px;color:#15171A}
.cardhd .meta{font-weight:500;font-size:13px;color:#8A93A0}
.hdttl{display:flex;align-items:center;gap:9px}
.addinline{width:25px;height:25px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--accent);font-weight:700;font-size:17px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.addinline:hover{background:var(--accent-wash);border-color:#B9D4F6}
.arow{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-top:1px dotted var(--dot)}
.arow:first-child{border-top:none}
.atime{width:74px;flex:none}
.atime .t{font-weight:600;font-size:14px;color:#15171A}
.atime .t .ap{font-weight:500;font-size:11px;color:#AEB6C1}
.atime .d{font-weight:500;font-size:11.5px;color:#AEB6C1}
.atime.kind{font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:#8A93A0}
.atime.k-task{color:#1F6FEB}
.atime.k-event{color:#7A5BD8}
.abody{flex:1;min-width:0}
.atitle{font-weight:600;font-size:15px;color:#15171A}
.atitle.done{color:#AEB6C1}
.atitle.block{font-weight:600;color:#8A93A0}
.ameta{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:12.5px;color:#8A93A0}
.view{font-weight:500;font-size:12.5px;color:var(--accent-deep);cursor:pointer;background:none;border:none;padding:0}
.aright{display:flex;align-items:center;gap:10px;flex:none}
.pill{font-weight:500;font-size:11.5px;color:#5A616B;background:#EEF2F7;border-radius:999px;padding:3px 10px}
.pill.now{font-weight:600;color:var(--accent-deep);background:var(--accent-wash)}
.pill.due{font-weight:600;color:#B4792B;background:#FBF1E6}
.check{width:20px;height:20px;border-radius:999px;border:1.5px solid #C2CAD6;background:rgba(255,255,255,.72);cursor:pointer;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 2px rgba(20,40,80,.07),inset 0 1px 0 rgba(255,255,255,.9)}
.check.on{background:var(--accent);border-color:var(--accent);box-shadow:0 2px 9px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.check.sm{width:16px;height:16px}
.subs{margin-top:9px;border-left:1px solid #E7ECF2;padding-left:14px;display:flex;flex-direction:column;gap:5px}
.subrow{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.subrow.done .slabel{color:#AEB6C1}
.slabel{flex:1;min-width:0}
.avm{width:26px;height:26px;font-size:11px}
.empty{padding:34px 10px;text-align:center}
.empty .big{font-weight:700;font-size:17px;color:#2B3440}
.empty .sub{font-weight:400;font-size:12.5px;color:#8A93A0;margin-top:5px}

/* habit cards */
.habs{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.habcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.big{font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stepbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--field);background:#fff;font-size:20px;color:#15171A;cursor:pointer;line-height:1}
.bars{display:flex;align-items:flex-end;gap:6px;height:42px;margin-top:14px}
.bars > div{flex:1;border-radius:3px 3px 0 0;background:#E6ECF3}
.bars > div.now{background:var(--accent)}
.hhr{border:none;border-top:1px solid var(--line-soft);margin:16px 0}
.streakdots{display:inline-flex;gap:4px}
.sd{width:7px;height:7px;border-radius:999px;background:#DDE4EC}
.sd.on{background:var(--accent)}

/* calendar */
.calbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.calbar h2{margin:0;font-weight:700;font-size:20px;color:#15171A;min-width:150px;letter-spacing:-.01em}
.calnav{display:inline-flex;gap:4px}
.cal-tl{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cal-tl .tlrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.cal-tl .tlname{width:120px;flex:none;font-weight:600;font-size:11.5px;color:#2F343B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-tl .track{position:relative;flex:1;height:18px;background:#F2F6FB;border-radius:6px}
.cal-tl .bar{position:absolute;top:0;height:18px;border-radius:6px;cursor:pointer}
.cal-tl .tllabel{font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#AEB6C1;margin-bottom:2px}
.calgrid{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dowrow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.dowrow div{padding:9px 10px;font-weight:600;font-size:11px;color:#9AA3AF}
.weeks{display:block}
.wkrow{display:grid;grid-template-columns:repeat(7,1fr)}
.daycellm{min-height:98px;border-left:1px solid var(--line-soft);border-top:1px solid var(--line-soft);padding:6px 7px;cursor:pointer;overflow:hidden}
.wkrow:first-child .daycellm{border-top:none}
.daycellm:first-child{border-left:none}
.daycellm.out{background:#FBFCFE}
.daycellm.out .dn{color:#C8D0DB}
.daycellm .dn{font-weight:600;font-size:12px;color:#5A616B}
.daycellm.today .dn{display:inline-flex;min-width:20px;height:20px;padding:0 5px;border-radius:7px;background:var(--accent);color:#fff;align-items:center;justify-content:center}
.daycellm.inrange{background:var(--accent-wash)}
.daycellm.rgend{background:var(--accent-wash);box-shadow:inset 0 0 0 2px var(--accent)}
.rgbar{display:flex;align-items:center;gap:12px;margin-top:12px;padding:9px 14px;background:var(--accent-wash);border:1px solid #BCD6F8;border-radius:12px;font-size:13px;color:var(--accent-deep);flex-wrap:wrap}
.rgbar .rgt b{color:var(--accent-deep);font-weight:700}
.pillbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#F7F9FC}
.rphd{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.rpm{font-weight:700;font-size:13.5px;color:#15171A}
.rpnav{border:none;background:none;cursor:pointer;display:flex;padding:4px;border-radius:6px}
.rpnav:hover{background:#E8EEF6}
.rpdow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.rpdow span{text-align:center;font-size:10px;font-weight:600;color:#AEB6C1}
.rpgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.rpd{border:none;background:none;cursor:pointer;font:inherit;font-size:12.5px;color:#2F343B;height:30px;border-radius:7px}
.rpd:hover{background:#E8F1FF}
.rpd.out{color:#C8D0DB}
.rpd.t{font-weight:700;color:var(--accent-deep)}
.rpd.inr{background:var(--accent-wash);border-radius:0}
.rpd.ise{background:var(--accent);color:#fff;border-radius:7px;font-weight:600}
.rpsummary{font-size:12px;color:#8A93A0;margin-top:8px;font-weight:500}
.celI{display:block;width:100%;text-align:left;border:none;background:var(--wash);border-radius:5px;padding:2px 6px;margin-top:3px;font-weight:500;font-size:10.5px;color:#2B2F36;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.celI.ev{background:var(--accent-wash);color:var(--accent-deep)}
.celI.due{background:#FBF1E6;color:#9A6418}
.celI.proj{background:#EDEAFB;color:#5A4FAE}
.celI.done{opacity:.5;text-decoration:line-through}
.cmore{font-weight:600;font-size:10px;color:#9AA3AF;margin-top:3px;padding-left:2px}
/* week calendar */
.wkcal{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wkcalhd{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--line)}
.wkcalhd .wd{padding:8px 6px;text-align:center;font-weight:600;font-size:11px;color:#5A616B;border-left:1px solid var(--line-soft)}
.wkcalhd .wd .num{display:block;font-size:16px;color:#15171A;font-weight:700;margin-top:2px}
.wkcalhd .wd.today .num{color:#fff;background:var(--accent);width:26px;height:26px;border-radius:999px;line-height:26px;margin:2px auto 0}
.allday{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--line)}
.allday .lab{font-weight:600;font-size:9px;color:#AEB6C1;padding:7px 4px;text-transform:uppercase;letter-spacing:.04em;text-align:right}
.allday .adc{border-left:1px solid var(--line-soft);padding:4px;min-height:34px;cursor:pointer}
.adi{display:block;width:100%;text-align:left;border:none;background:var(--wash);border-radius:5px;padding:2px 6px;margin-bottom:3px;font-weight:500;font-size:10px;color:#2B2F36;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.adi.due{background:#FBF1E6;color:#9A6418}
.hwrap{position:relative;max-height:520px;overflow-y:auto}
.hgrid{display:grid;grid-template-columns:52px repeat(7,1fr)}
.htcol{display:flex;flex-direction:column}
.htime{height:46px;font-weight:500;font-size:10px;color:#AEB6C1;text-align:right;padding:0 6px;transform:translateY(-6px)}
.hcol{position:relative;border-left:1px solid var(--line-soft)}
.hcell{height:46px;border-top:1px solid var(--line-soft);cursor:pointer}
.evb{position:absolute;left:3px;right:3px;background:var(--accent-wash);border:1px solid #B9D3FF;border-left:3px solid var(--accent);border-radius:6px;padding:3px 6px;font-weight:600;font-size:10.5px;color:var(--accent-deep);overflow:hidden;cursor:pointer;z-index:2}

/* calendar v2 */
.calfilters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:22px;margin-bottom:12px}
.fsel{border:1px solid var(--field);background:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:12.5px;color:#2F343B;cursor:pointer;-webkit-appearance:none;appearance:none}
.calsplit{display:flex;gap:16px;align-items:flex-start}
.calrail{width:236px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;max-height:640px;overflow-y:auto}
.railhd{font-weight:700;font-size:13px;color:#15171A;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.railn{font-weight:600;font-size:11px;color:#8A93A0;background:#EEF2F7;border-radius:999px;padding:1px 7px}
.railhint{font-weight:500;font-size:11.5px;color:var(--accent-deep);background:var(--accent-wash);border-radius:8px;padding:8px 9px;margin-bottom:8px;line-height:1.45}
.urow{display:flex;align-items:center;gap:9px;padding:8px 7px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.urow:hover{background:var(--wash)}
.urow.sel{border-color:var(--accent);background:var(--accent-wash)}
.urow .ut{flex:1;min-width:0;font-weight:500;font-size:13px;color:#15171A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railadd{margin-top:8px;border:none;background:none;color:var(--accent-deep);font-weight:600;font-size:12.5px;cursor:pointer;padding:6px 2px}
.calmain{flex:1;min-width:0}
.wkcal{overflow-x:auto;overflow-y:hidden}
.wkinner{min-width:660px}
.evchk{width:14px;height:14px;border-radius:999px;border:1.5px solid rgba(20,30,50,.28);flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff}
.evchk.on{background:var(--accent);border-color:var(--accent)}
.evb{display:flex;align-items:center;gap:5px}
.evb .evtt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evb .evtm{font-weight:500;opacity:.65;margin-left:auto;padding-left:4px}
.adi{display:flex;align-items:center;gap:6px}
.hgrid{position:relative}
.nowline{position:absolute;left:52px;right:0;height:2px;background:#E5484D;z-index:4;pointer-events:none}
.nowline::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:999px;background:#E5484D}
@media(max-width:820px){ .calsplit{flex-direction:column} .calrail{width:100%;max-height:none;order:2} .calmain{order:1;width:100%} }
/* timeline */
.tlwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
.tlhead{display:flex;border-bottom:1px solid var(--line);background:var(--card)}
.tlcorner{width:140px;flex:none;padding:9px 12px;font-weight:600;font-size:10px;color:#9AA3AF;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:flex-end}
.tlday{flex:none;text-align:center;padding:5px 0 6px;font-weight:600;font-size:12px;color:#5A616B;border-left:1px solid var(--line-soft)}
.tlday .tldow{display:block;font-weight:500;font-size:9px;color:#AEB6C1}
.tlday.we{background:#FAFBFD}
.tlday.today{background:var(--accent);color:#fff}
.tlday.today .tldow{color:rgba(255,255,255,.8)}
.tlbody{position:relative}
.tlrow{display:flex;align-items:center;border-top:1px solid var(--line-soft);height:44px}
.tlrow:first-child{border-top:none}
.tlname2{width:140px;flex:none;padding:0 12px;font-weight:600;font-size:12.5px;color:#15171A;display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tltrack{position:relative;height:44px;cursor:pointer}
.tlbar2{position:absolute;top:11px;height:22px;border-radius:7px;border:none;color:#fff;font-weight:600;font-size:11px;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center}
.tlnodate{position:absolute;left:8px;top:14px;font-size:11px;color:#C2CAD6}
.tldot{position:absolute;top:30px;width:8px;height:8px;border-radius:999px;background:#B4792B;border:1.5px solid #fff}
.tltoday{position:absolute;top:0;bottom:0;width:2px;background:#E5484D;z-index:3;pointer-events:none}

/* projects */
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:16px;margin-top:22px}
.projcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(30,70,140,.04);text-align:left;transition:transform .13s cubic-bezier(.16,1,.3,1),box-shadow .13s,border-color .13s}
.projcard:hover{border-color:#C7D3E4;box-shadow:0 10px 26px rgba(30,70,140,.11);transform:translateY(-2px)}
.pc-band{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:var(--accent-wash)}
.pc-glyph{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;background:var(--accent);box-shadow:0 2px 7px var(--glow)}
.pc-ring{position:relative;width:44px;height:44px}
.pc-ring .arc{stroke:var(--accent)}
.pc-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10.5px;color:#15171A;font-variant-numeric:tabular-nums}
.pc-body{padding:12px 16px 15px}
.pc-name{font-weight:700;font-size:15.5px;letter-spacing:-.01em;color:#15171A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-kind{font-weight:600;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#9AA3AF;margin-top:3px}
.pc-tl{margin-top:12px}
.pc-notl{font-weight:500;font-size:11px;color:#AEB6C1}
.pc-tlbar{height:5px;border-radius:999px;background:#EAEFF5;overflow:hidden}
.pc-tlbar>i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s var(--ease-move)}
.pc-tldates{display:flex;justify-content:space-between;margin-top:6px;font-weight:500;font-size:10.5px;color:#9AA3AF}
.pbar{height:6px;border-radius:999px;background:#EAEFF5;margin-top:11px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s var(--ease-move)}
.pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.pc-due{font-weight:600;font-size:11px;padding:4px 10px;border-radius:999px;background:#F1F4F8;color:#5A616B;white-space:nowrap}
.pc-due.soon{background:#FFF2E2;color:#B4792B}
.pc-due.none{background:#F1F4F8;color:#9AA3AF}
.pc-open{display:flex;align-items:center;gap:7px;min-width:0}
.pc-count{font-weight:600;font-size:11.5px;color:#5A616B;white-space:nowrap}
.newproj{border:1.5px dashed #C7D3E4;background:rgba(255,255,255,.45);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;color:var(--accent-deep);cursor:pointer;min-height:150px}

/* project side panel */
.pov{position:fixed;inset:0;background:rgba(16,38,77,.22);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:60;display:flex;justify-content:flex-end;padding:18px;align-items:stretch}
.ppanel{width:452px;max-width:100%;height:100%;background:var(--glass);backdrop-filter:blur(26px) saturate(175%);-webkit-backdrop-filter:blur(26px) saturate(175%);border:1px solid var(--glass-line);border-radius:var(--radius-sheet);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 28px 80px rgba(16,40,82,.26),0 30px 90px -42px var(--glow),inset 0 1px 0 rgba(255,255,255,.5);animation:slidein .22s cubic-bezier(.16,1,.3,1)}
#root[data-ground="dark"] .ppanel{background:rgba(30,38,56,.62);border-color:rgba(255,255,255,.12);box-shadow:0 28px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.pmeta{display:flex;align-items:center;gap:10px;margin-top:10px}
.pmeta-t{font-weight:500;font-size:12.5px;color:#5A616B}
.pprog{font-weight:500;font-size:11.5px;color:#8A93A0;margin-top:6px}
.prail{margin-top:16px;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:106px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.prow:last-child{border-bottom:none}
.prow .k{color:#8A93A0;font-weight:500}
.prow .v{color:#15171A;font-weight:500;display:flex;align-items:center;gap:7px}
.pvtoggle{display:inline-flex;border:1px solid var(--field);border-radius:8px;overflow:hidden}
.pvtoggle button{border:none;background:#fff;font:inherit;font-size:12.5px;font-weight:600;color:#8A93A0;padding:6px 15px;cursor:pointer}
.pvtoggle button.on{background:var(--accent-wash);color:var(--accent-deep)}
.tline{position:relative;margin-top:18px}
.tlrow{position:relative;padding:0 0 20px 32px;min-height:22px}
.tlrow:before{content:"";position:absolute;left:7px;top:5px;height:100%;width:2px;background:#E1E7F0}
.tlrow:last-child:before{display:none}
.tldot{position:absolute;left:1px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-sizing:border-box;z-index:1}
.tldot.done{background:var(--accent)}
.tldot.open{border-color:#C7D3E4}
.tldot.bookend{background:#15171A;border-color:#15171A}
.tldot.today{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-wash)}
.tlc{min-width:0}
.tlhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tlc .tt{font-size:14px;font-weight:600;color:#15171A;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlc .tt.done{color:#AEB6C1;text-decoration:line-through}
.tlc .tt.now{color:var(--accent-deep)}
.tlc .dd{font-size:12px;color:#8A93A0;margin-top:2px}
.tlc .gap{font-size:10.5px;color:#C0C6D0;font-weight:500;margin-top:9px}
.tlempty{font-size:13px;color:#8A93A0;margin-top:22px;line-height:1.55}
@keyframes slidein{from{transform:translateX(34px);opacity:0}to{transform:none;opacity:1}}
.phd{padding:20px 22px 16px;border-bottom:1px solid var(--line);flex:none}
.phtop{display:flex;align-items:flex-start;gap:10px}
.ptitle{font-weight:700;font-size:21px;color:#15171A;letter-spacing:-.01em;flex:1;min-width:0}
.pbody{padding:16px 22px 40px;flex:1;overflow-y:auto}
.pstrip{height:26px;background:#F2F6FB;border-radius:8px;position:relative;margin:10px 0 4px}
.pstrip>i{position:absolute;top:0;bottom:0;border-radius:8px;opacity:.85}
.pstrip .tick{position:absolute;top:-4px;width:2px;height:34px;background:#15171A;border-radius:2px}
.pstrip .mk{position:absolute;top:-3px;width:8px;height:8px;border-radius:999px;background:#B4792B;transform:translateX(-4px);border:1.5px solid #fff}
.psec{margin-top:24px}
.psec h4{margin:0 0 6px;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9AA3AF}
.irow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft)}
.irow:first-child{border-top:none}
.ibody{flex:1;min-width:0}
.ititle{font-weight:600;font-size:14px;color:#15171A}
.ititle.done{color:#AEB6C1}
.matrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft)}
.matrow:first-child{border-top:none}
.matrow a{color:var(--accent-deep);font-weight:600;font-size:13px;text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addrow input{border:1px solid var(--field);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff}
.addrow input.grow{flex:1;min-width:120px}
.mini{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:0 13px;font-weight:600;font-size:13px;cursor:pointer}
.mini.ghost{background:#fff;border:1px solid var(--field);color:#2F343B}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:999px;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--field);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--accent)}

/* journal */
.cols{display:flex;flex-wrap:wrap;gap:22px;margin-top:24px;align-items:flex-start}
.colmain{flex:999 1 500px;min-width:0}
.colside{flex:1 1 320px;min-width:280px}
.jwrite{padding:22px 24px}
.jprompt{margin:8px 0 14px;font-weight:500;font-size:15px;color:#3A4350}
.ta{width:100%;min-height:120px;border:1px solid var(--field);border-radius:12px;background:#FBFDFF;padding:14px;font-family:inherit;font-size:14px;color:#15171A;resize:vertical}
.tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.tagchip{font-weight:500;font-size:11.5px;color:#49505A;border:1px solid var(--field);border-radius:999px;padding:5px 12px;cursor:pointer;background:#fff}
.tagchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.savebtn{margin-left:auto;background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 4px 14px var(--glow),inset 0 1px 0 rgba(255,255,255,.22)}
.jentry{padding:16px 20px;margin-bottom:12px}
.jentry .jh{display:flex;justify-content:space-between;align-items:baseline}
.jentry p{margin:7px 0 0;font-size:14px;line-height:1.55;color:#39414C}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(16,38,77,.40);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70}
.modal{background:#fff;border-radius:22px;width:100%;max-width:482px;max-height:92vh;overflow-y:auto;padding:24px 26px 22px;box-shadow:0 30px 90px rgba(16,40,82,.34);animation:pop .2s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.mhd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.mhd h3{margin:0;font-weight:700;font-size:19px;letter-spacing:-.01em;color:#15171A}
.meyebrow{font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:3px}
.x{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;border:none;background:#F1F5FA;color:#6A7382;font-size:18px;cursor:pointer;line-height:1;flex:none}
.x:hover{background:#E6ECF3;color:#3A4350}
.lbl{display:block;font-weight:600;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#9AA3AF;margin:14px 0 6px}
.fld{width:100%;border:1px solid var(--field);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;color:#15171A;background:#FBFDFF;transition:border-color .12s,box-shadow .12s,background .12s}
.fld:focus,.subedit input:focus,.addrow input:focus,.gate input:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash);background:#fff}
.ownerseg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--field);border-radius:10px;overflow:hidden}
.ownerseg button{border:none;background:#fff;padding:9px 0;font-weight:500;font-size:12.5px;color:#5A616B;cursor:pointer;border-left:1px solid var(--field)}
.ownerseg button:first-child{border-left:none}
.ownerseg button.on{background:var(--ink);color:#fff}
.travhint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.subedit{display:flex;align-items:center;gap:7px;margin:5px 0}
.subedit input[type=text]{flex:1;border:1px solid var(--field);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;min-width:0}
.subedit input[type=date]{border:1px solid var(--field);border-radius:8px;padding:7px 8px;font-size:12px;font-family:inherit;color:#5A616B;flex:none;width:122px}
.subedit input[type=time]{border:1px solid var(--field);border-radius:8px;padding:7px 8px;font-size:12px;font-family:inherit;color:#5A616B;flex:none;width:92px}
.linkbtn{border:none;background:none;color:var(--accent-deep);font-weight:600;font-size:12.5px;cursor:pointer;padding:5px 0}
.mactions{display:flex;gap:10px;margin-top:18px;align-items:center}
.btn{border-radius:11px;padding:11px 18px;font-weight:600;font-size:13.5px;cursor:pointer;flex:1;text-align:center;transition:transform .1s,box-shadow .12s,background .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;border:1px solid var(--field);color:#15171A}
.btn.ghost:hover{background:#F6F9FC}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-deep));border:none;color:#fff;box-shadow:0 4px 14px var(--glow),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.primary:hover{box-shadow:0 7px 22px var(--glow),inset 0 1px 0 rgba(255,255,255,.22);filter:brightness(1.03)}
.btn.del{flex:none;background:none;border:none;color:#C64A3B;font-weight:600;font-size:12.5px;padding:10px 4px;cursor:pointer}

/* gate */
.gate{height:100%;display:flex;align-items:center;justify-content:center;background:var(--grad);padding:24px}
.gatecard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 28px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(30,70,140,.18);text-align:center}
.gatecard .brand{margin:0 auto 14px}
.gate h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}

/* ---- motion: one set of curves and timings, reused everywhere ---- */
.stk{background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 1.5px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .22s var(--ease-out)}
.done .stk,.done.stk{background-size:100% 1.5px}
.check{transition:transform .12s var(--ease-out),background-color .15s,border-color .15s}
.view,.gbtn,.pillbtn,.navcirc,.stepbtn,.addinline,.mini,.morerow,.toast-act,.segc button,.pviews button,.kebab{transition:transform .12s var(--ease-out)}
.check:active,.view:active,.gbtn:active,.pillbtn:active,.navcirc:active,.stepbtn:active,.addinline:active,.mini:active,.morerow:active,.toast-act:active,.segc button:active,.pviews button:active,.kebab:active,.wavefab:active,.whorow:active,.nav:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){ .lc2,.pc2,.whocard{transition:border-color .15s,box-shadow .15s,transform .15s var(--ease-out)} .lc2:hover,.pc2:hover{transform:translateY(-1px)} }
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes slideout{to{transform:translateX(34px);opacity:0}}
@keyframes popout{to{transform:scale(.98);opacity:0}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,8px)}}
@keyframes slideup{from{transform:translateY(36px);opacity:0}}
@keyframes slidedown{to{transform:translateY(36px);opacity:0}}
.pov,.overlay{animation:fadein .2s var(--ease-out)}
.pov.closing,.overlay.closing{animation:fadeout .16s var(--ease-out) forwards;pointer-events:none}
.pov.closing .ppanel{animation:slideout .16s var(--ease-out) forwards}
.overlay.closing .modal,.overlay.closing .setmodal{animation:popout .14s var(--ease-out) forwards}
.toast.closing{animation:toastout .16s var(--ease-out) forwards}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}}
.rowin{animation:rowin .2s var(--ease-out)}
.ptchip{position:fixed;z-index:93;pointer-events:none;font-weight:700;font-size:12.5px;color:#fff;background:var(--accent);border-radius:99px;padding:3px 9px;box-shadow:0 6px 16px rgba(31,111,235,.35);font-variant-numeric:tabular-nums;white-space:nowrap}
@keyframes crowndrop{0%{transform:translateY(-14px) rotate(-14deg);opacity:0}60%{transform:translateY(2px) rotate(5deg);opacity:1}100%{transform:none;opacity:1}}
.crownp.fresh svg{animation:crowndrop .6s var(--ease-pop)}
@keyframes leadglow{0%{box-shadow:0 0 0 0 rgba(180,121,43,.55)}100%{box-shadow:0 0 0 12px rgba(180,121,43,0)}}
.crownp.fresh{animation:leadglow 1.1s ease-out}
.flame{display:inline-flex;color:#C2704B;vertical-align:-1px;margin-right:4px}
@keyframes flamebump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.flame.bump{animation:flamebump .4s var(--ease-pop)}
@keyframes fpulse{0%{box-shadow:0 0 0 0 rgba(46,158,107,.45)}100%{box-shadow:0 0 0 14px rgba(46,158,107,0)}}
.focusw.done{border-color:#BFE3CF;animation:fpulse 1.4s ease-out 2}
.wpart{position:fixed;left:50%;top:56%;font-size:26px;pointer-events:none;z-index:91;opacity:0;animation:wdrift 1.6s var(--ease-out) forwards}
@keyframes wdrift{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-170px) scale(1)}}
@media(max-width:820px){
  .ppanel{animation:slideup .26s var(--ease-out)}
  .pov.closing .ppanel{animation:slidedown .18s var(--ease-out) forwards}
  .moresheet,.modal.confirm{animation:slideup .24s var(--ease-out)}
  .overlay.closing .moresheet,.overlay.closing .modal.confirm{animation:slidedown .16s var(--ease-out) forwards}
}

  function durOf(r){ if(!r.start||!r.end) return ''; var a=r.start.split(':'),b=r.end.split(':'); var m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]); var hh=Math.floor(m/60),mm=m%60; return hh+'h'+(mm?' '+mm+'m':''); }

  function FocusCard(props){

  // ---- Calendar ----
  function Calendar(props){

    var foS=useState('all'); var fo=foS[0], setFo=foS[1];

    function dayItems(ds){

      (tasks||[]).forEach(function(t){ if(pass(t)&&t.due===ds&&!t.done&&t.date!==ds) items.push({k:'due',label:'⚑ '+t.title,t:t}); });
      (projects||[]).forEach(function(p){ if(p.archived||!projPass(p))return; if(p.end_date===ds) items.push({k:'proj',label:'◆ '+p.name,pid:p.id}); else if(p.start_date===ds) items.push({k:'proj',label:'▸ '+p.name,pid:p.id}); });

      <div style=${{marginLeft:'auto',display:'flex',gap:'8px',flexWrap:'wrap'}}>

    var rail = html`<aside class="calrail">

        return html`<div class=${'urow'+(selId===t.id?' sel':'')} key=${t.id} onClick=${function(){setSel(selId===t.id?null:t.id);}}>

    </aside>`;


    // ---- Day: one day by the hour, with what has no time beside it ----
    if(mode==='day'){
      var ds=ymd(cur), isTd=ds===TODAY, me=VIEW.who;
      var DH0=7, DH1=23, DROW=48;
      var rts=(props.routines||[]).filter(function(r){ return (!r.days||r.days==='daily') && r.start && r.end; });
      var tItems=timed(ds).map(function(t){ var p=t.time.split(':'), st=(+p[0])*60+(+p[1]); return {t:t, st:st, en:st+(isEventType(t.type)?60:45)}; });
      var rItems=rts.map(function(r){ var a=r.start.split(':'), b=r.end.split(':'); return {r:r, st:(+a[0])*60+(+a[1]), en:(+b[0])*60+(+b[1])}; }).filter(function(x){ return x.en>x.st; });
      var items=rItems.concat(tItems).sort(function(a,b){ return a.st-b.st||b.en-a.en; });
      // side by side when two things overlap

      function closeCluster(){ var n=Math.max(1,lanesEnd.length); cluster.forEach(function(x){ x.lanes=n; }); cluster=[]; lanesEnd=[]; }
      items.forEach(function(x){ if(x.st>=clusterEnd) closeCluster(); var l=0; while(l<lanesEnd.length&&lanesEnd[l]>x.st) l++; lanesEnd[l]=x.en; x.lane=l; cluster.push(x); clusterEnd=Math.max(clusterEnd,x.en); });
      closeCluster();
      var hasTimed=items.length>0, fold=!hasTimed&&!showHours;
      var anyT=allday(ds).filter(function(t){ return !isEventType(t.type); }).sort(function(a,b){ return (a.done?1:0)-(b.done?1:0); });

          </aside>

        </div>
      <//>`;
    } else if(mode==='timeline'){
      var mstart=new Date(cur.getFullYear(),cur.getMonth(),1);

      var todayOff=(TODAY>=ymd(mstart)&&TODAY<=ymd(addDays(mstart,ndays-1)))?off(TODAY):-1;

            return html`<div class="tlrow" key=${p.id}>
              <div class="tlname2"><span class="dot" style=${{background:p.color}}></span>${p.name}</div>
              <div class="tltrack" style=${{width:(ndays*DW)+'px'}} onClick=${function(){props.onOpenProject(p.id);}}>
                ${(hasTl&&e>=0&&s<=ndays-1)?html`<button class="tlbar2" style=${{left:(s*DW)+'px',width:((e-s+1)*DW)+'px',background:p.color||'#1F6FEB'}} onClick=${function(ev){ev.stopPropagation();props.onOpenProject(p.id);}}>${p.name}</button>`:html`<span class="tlnodate">no dates set</span>`}
                ${pdue.map(function(t){ var o=off(t.due); if(o<0||o>ndays-1)return null; return html`<span class="tldot" key=${t.id} title=${t.title+' · '+shortDate(t.due)} style=${{left:(o*DW+DW/2-4)+'px'}}></span>`; })}
              </div>
            </div>`;
          })}
          ${todayOff>=0?html`<div class="tltoday" style=${{left:(140+todayOff*DW+DW/2)+'px'}}></div>`:null}
        </div>
      </div></div>`;
    } else {
      var wsd=startOfWeek(cur); var days=[]; for(var k=0;k<7;k++){ days.push(addDays(wsd,k)); }
      var anyTimed=days.some(function(dd){ return timed(ymd(dd)).length>0; }), fold=!anyTimed&&!showHours;
      var hours=[]; for(var hh=H0;hh<=H1;hh++){ hours.push(hh); }
      var now=new Date(); var nowFrac=now.getHours()+now.getMinutes()/60;

            ${dues(ds).map(function(t){ return html`<button class="adi due" key=${'d'+t.id} onClick=${function(e){e.stopPropagation();props.onEditTask(t);}}>⚑ ${t.title}</button>`; })}

            </div>`;

          ${showNow?html`<div class="nowline" style=${{top:((nowFrac-H0)*ROW)+'px'}}></div>`:null}
        </div></div>`}
      </div></div>`;
    }

    return html`<${Fragment}>

      ${rg?html`<div class="rgbar">
        <span class="rgt">${!rg.start?'Click the project’s start day on the calendar…':(!rg.end?('Start '+shortDate(rg.start)+' — now click the deadline day…'):html`<b>${shortDate(rg.start)} → ${shortDate(rg.end)}</b> · ${Math.round((parseYmd(rg.end)-parseYmd(rg.start))/86400000)+1} days`)}</span>

      <p style=${{fontWeight:400,fontSize:'12px',color:'var(--accent-muted)',margin:'12px 2px 0'}}>${selTask?'Now pick a day or time for it.':'Pick a task on the left to give it a day, or tap any day to add something. Select two days to start a project across them.'}</p>

  // ---- Tasks table (the "Show all" destination) ----
  function TasksTable(props){
    var tasks=props.tasks, projects=props.projects;
    var projMap={}; (projects||[]).forEach(function(p){projMap[p.id]=p;});
    var oS=useState('all'); var fo=oS[0], setFo=oS[1];
    var pS=useState('all'); var fp=pS[0], setFp=pS[1];
    var sS=useState('open'); var fsv=sS[0], setFs=sS[1];
    function bucket(t){
      if(t.done) return {k:'done',l:'Done',o:6};
      // planned for a day that has passed counts as overdue too, not "No deadline"
      if(!t.due) return (t.date&&t.date<TODAY&&!isEventType(t.type))?{k:'over',l:'Overdue',o:0}:{k:'nodate',l:'No deadline',o:5};
      var d=daysUntil(t.due);
      if(d<0) return {k:'over',l:'Overdue',o:0};
      if(d===0) return {k:'today',l:'Today',o:1};
      if(d<=7) return {k:'week',l:'This week',o:2};
      return {k:'later',l:'Later',o:3};
    }
    var list=(tasks||[]).filter(function(t){
      if(fo!=='all' && t.owner!==fo) return false;
      if(fp!=='all' && t.project!==fp) return false;
      if(fsv==='open' && t.done) return false;
      if(fsv==='done' && !t.done) return false;
      return true;
    });
    var groups={};
    list.forEach(function(t){ var b=bucket(t); if(!groups[b.k])groups[b.k]={l:b.l,o:b.o,items:[]}; groups[b.k].items.push(t); });
    var order=Object.keys(groups).sort(function(a,b){return groups[a].o-groups[b].o;});
    order.forEach(function(k){ groups[k].items.sort(function(a,b){ var ad=a.due||'9999-99',bd=b.due||'9999-99'; return ad<bd?-1:ad>bd?1:0; }); });
    return html`<${Fragment}>
      <div class="tvbar">
        <select class="tsel" value=${fo} onChange=${function(e){setFo(e.target.value);}}>
          ${ownerOptions()}
        </select>
        <select class="tsel" value=${fp} onChange=${function(e){setFp(e.target.value);}}>
          <option value="all">All projects</option>${(projects||[]).filter(function(p){return !p.archived;}).map(function(p){return html`<option key=${p.id} value=${p.id}>${p.name}</option>`;})}
        </select>
        <select class="tsel" value=${fsv} onChange=${function(e){setFs(e.target.value);}}>
          <option value="open">To do</option><option value="done">Done</option><option value="all">Everything</option>
        </select>
        <span class="tvcount">${list.length} task${list.length===1?'':'s'}</span>
      </div>
      ${order.length===0?html`<div class="empty" style=${{marginTop:'46px'}}><div class="big">Nothing here</div><div class="sub">No tasks match these filters — widen them, or add a task.</div></div>`
      :html`<div class="tvtable">
        ${order.map(function(k){ var g=groups[k];
          return html`<${Fragment} key=${k}>
            <div class="tvghd">${g.l}<span>${g.items.length}</span></div>
            ${g.items.map(function(t){ var p=projMap[t.project]; var ov=bucket(t).k==='over';
              return html`<div class="tvrow" key=${t.id} onClick=${function(){props.onEdit(t);}}>
                <span class="tvc1" onClick=${function(e){e.stopPropagation();}}>${isEventType(t.type)?html`<span class="tvev" style=${{color:typeDef(t.type).color}}>${typeDef(t.type).label}</span>`:html`<${Check} done=${t.done} label=${t.title} onClick=${function(){props.onToggle(t);}} />`}</span>
                <span class=${'tvttl'+(t.done?' done':'')}>${t.title||'Untitled task'}</span>
                ${p?html`<span class="tvproj"><span class="dot" style=${{background:p.color,width:'7px',height:'7px'}}></span><span class="tvpn">${p.name}</span></span>`:html`<span class="tvproj none">—</span>`}
                <${Avatar} owner=${t.owner} cls="avm" />
                <span class=${'tvdue'+(ov?' over':'')}>${t.due?(shortDate(t.due)+(t.due_time?(' · '+to12(t.due_time)):'')):(ov?('planned '+shortDate(t.date)):'—')}</span>
              </div>`;
            })}
          <//>`;
        })}
      </div>`}
    <//>`;
  }

  // ---- Project timeline (itinerary of deadlines) ----
  function ProjectTimeline(props){
    var p=props.project, tasks=props.tasks;
    function wk(ds){ return shortDate(ds); }
    function between(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); }
    var dated=(tasks||[]).filter(function(t){return t.project===p.id && t.due;});
    if(dated.length===0 && !p.start_date && !p.end_date){
      return html`<p class="tlempty">Give this project a start and a deadline — and tasks with due dates — to see it drawn as a timeline.</p>`;
    }
    var nodes=[];
    if(p.start_date) nodes.push({kind:'start',date:p.start_date,label:'Started'});
    dated.forEach(function(t){ nodes.push({kind:'task',date:t.due,task:t}); });
    if(p.end_date) nodes.push({kind:'end',date:p.end_date,label:'Deadline'});
    var inRange=(!p.start_date||TODAY>=p.start_date)&&(!p.end_date||TODAY<=p.end_date);
    if(inRange) nodes.push({kind:'today',date:TODAY,label:'Today'});
    var ord={start:0,today:1,task:2,end:3};
    nodes.sort(function(a,b){ if(a.date!==b.date) return a.date<b.date?-1:1; return ord[a.kind]-ord[b.kind]; });
    return html`<div class="tline">
      ${nodes.map(function(n,i){
        var gap = i<nodes.length-1 ? between(n.date, nodes[i+1].date) : 0;
        var dotcls = n.kind==='today'?'today':(n.kind==='start'||n.kind==='end')?'bookend':(n.task&&n.task.done?'done':'open');
        return html`<div class="tlrow" key=${i}>
          <span class=${'tldot '+dotcls}></span>
          <div class="tlc">
            <div class="tlhead">
              <span class=${'tt'+(n.task&&n.task.done?' done':'')+(n.kind==='today'?' now':'')}>${n.kind==='task'?n.task.title:n.label}</span>
              ${n.kind==='task'?html`<${Avatar} owner=${n.task.owner} cls="avm" />`:null}
            </div>
            <div class="dd">${wk(n.date)}${n.kind==='task'&&n.task.due_time?(' · '+to12(n.task.due_time)):''}</div>
            ${gap>0?html`<div class="gap">${gap} day${gap>1?'s':''}</div>`:null}
          </div>
        </div>`;
      })}
    </div>`;
  }

  // ---- inline date-range picker (Airbnb-style) ----

    function pick(ds){ if(!start||(start&&end)){ props.onChange(ds,''); } else { var a=start,b=ds; if(b<a){var t=a;a=b;b=t;} props.onChange(a,b); } }
    return html`<div class="rp">
      <div class="rphd">
        <button type="button" class="rpnav" aria-label="Previous month" onClick=${function(){setCm(addMonths(cm,-1));}}>${chevL}</button>
        <span class="rpm">${monthY(cm)}</span>

      <div class="rpgrid">${cells.map(function(d){ var ds=ymd(d); var out=d.getMonth()!==cm.getMonth(); var inr=!!(start&&end&&ds>=start&&ds<=end); var ise=(ds===start||ds===end); var isT=ds===TODAY;
        return html`<button type="button" key=${ds} class=${'rpd'+(out?' out':'')+(inr?' inr':'')+(ise?' ise':'')+(isT?' t':'')} onClick=${function(){pick(ds);}}>${d.getDate()}</button>`;

    </div>`;
  }

  // ---- Journal ----
  function Journal(props){
    var entries=props.entries, whoami=props.whoami, topics=props.topics, topicLinks=props.topicLinks;
    var draftS=useState(''); var draft=draftS[0], setDraft=draftS[1];
    var tagS=useState(''); var tag=tagS[0], setTag=tagS[1];
    var todayEntry=(entries||[]).filter(function(e){return e.date===TODAY && e.owner===whoami;})[0];
    // an unsaved draft is kept on this device, so switching tabs (or the app closing) doesn't lose it
    var draftKey='sp_jdraft_'+TODAY+'_'+whoami;
    useEffect(function(){ var local=lsGet(draftKey,null); setDraft(local!=null?local:(todayEntry?(todayEntry.text||''):'')); setTag(todayEntry?(todayEntry.tag||''):''); },[todayEntry&&todayEntry.id, draftKey]);
    var shS=useState(false); var share=shS[0], setShare=shS[1];
    useEffect(function(){ setShare(todayEntry?!!todayEntry.space_id:false); },[todayEntry&&todayEntry.id]);
    var shareChanged=!!todayEntry&&(!!todayEntry.space_id)!==share;
    var savedText=todayEntry?(todayEntry.text||''):'';
    var jstatus = props.pending?(props.offline?'Not sent yet · it saves when you’re back online':'Saving…')
      : ((draft!==savedText||shareChanged)?((draft.trim()||shareChanged)?'Not saved yet':'') : (todayEntry&&todayEntry.updated_at?('Saved · '+timeOf(todayEntry.updated_at)):''));
    var TAGS=[['good','Good day'],['hard','Hard day'],['shipped','Shipped something'],['rest','Rest']];
    var earlier=(entries||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;}).filter(function(e){return !(e.date===TODAY&&e.owner===whoami);});
    var curWeek=ymd(startOfWeek(parseYmd(TODAY)));
    var curTopic=(topics||[]).filter(function(t){return t.week===curWeek;})[0];
    var curLinks=curTopic?(topicLinks||[]).filter(function(l){return l.topic_id===curTopic.id;}):[];
    var pastTopics=(topics||[]).filter(function(t){return t.week!==curWeek && t.title;}).slice(0,6);

          </div>
          <label class="jshare" for="j-share"><input id="j-share" type="checkbox" checked=${share} onChange=${function(e){setShare(e.target.checked);}} />Share tonight's entry with ${nameOf(otherOf(whoami))}</label>

  // Settings › Claude: your private connector link (the worker's /api/claude and /mcp)
  function ClaudeSettings(){
    var dS=useState(null); var d=dS[0], setD=dS[1];
    var eS=useState(''); var err=eS[0], setErr=eS[1];
    var bS=useState(false); var busy=bS[0], setBusy=bS[1];
    var cS=useState(false); var copied=cS[0], setCopied=cS[1];
    var aS=useState(false); var asking=aS[0], setAsking=aS[1];
    function call(body){ setBusy(true); setErr('');
      return fetch('/api/claude',body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'}:{credentials:'same-origin'})
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(j){ setD(j); setBusy(false); setAsking(false); })
        .catch(function(){ setErr('Couldn’t reach hate club. Check your connection and try again.'); setBusy(false); }); }

    if(!projects.length) es=html`<div class="pempty"><span class="pei">${html`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7.5A1.5 1.5 0 015.5 6h3.2a1.5 1.5 0 011.2.6l.9 1.2a1.5 1.5 0 001.2.6H18.5A1.5 1.5 0 0120 9.9V18a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 18V7.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 11.5v5M9.5 14h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`}</span><h2>No projects yet</h2><p>A project holds one big thing, like a portfolio or an application. Give it a deadline, then break it into tasks you can tick off.</p><div class="pea"><button type="button" class="btn primary" onClick=${props.onNew}>New project</button><button type="button" class="btn ghost" onClick=${props.onPickDates}>Pick dates on the calendar</button></div></div>`;
    else if(fstat==='active'&&!active.length) es=html`<div class="pempty"><span class="pei ok">${flagGlyph}</span><h2>Every project is finished</h2><p>All ${projects.length} are done. They stay under Finished, with their tasks and links, whenever you want to look back.</p><div class="pea"><button type="button" class="btn primary" onClick=${props.onNew}>New project</button><button type="button" class="btn ghost" onClick=${function(){setFstat('finished');}}>See finished · ${projects.length}</button></div></div>`;
    else if(!list.length) es=html`<div class="pempty"><span class="pei"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="M16 16l4 4M8.5 11h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><h2>No projects match</h2><p>Nothing is ${fstat==='finished'?'finished':(fstat==='active'?'active':'here')}${fown!=='all'?(' and owned by '+(fown===VIEW.who?'you':nameOf(fown))):''} yet. Clear a filter to see the rest.</p><div class="pea"><button type="button" class="btn ghost" onClick=${function(){ setFstat('active'); setFown('all'); }}>Clear filters</button></div></div>`;

    function nextCell(p){ var t=nextUp(p.id,tasks); if(!t){ var any=(stats[p.id]||projStats(p.id,tasks)).total; return html`<span class="muted">${any?'All done':'No tasks yet'} · <button type="button" class="linkbtn inl" onClick=${function(e){e.stopPropagation();props.onOpen(p.id);}}>${any?'+ Add a task':'+ Add the first task'}</button></span>`; }
      var c=soonChip(t.due||t.date); return html`<span class="nextc"><${Check} sm=${true} done=${false} label=${'Mark '+t.title+' done'} onClick=${function(e){ if(e) e.stopPropagation(); props.onToggle(t);}} /><span class="nt">${t.title}</span>${c?html`<span class=${'pill '+c.cls}>${c.txt}</span>`:null}</span>`; }
    function progCell(p){ var st=stats[p.id]||projStats(p.id,tasks); return st.total?html`<span class="progc"><span class="pbar2"><i style=${{width:st.pct+'%'}}></i></span><span class="tnum">${st.done} of ${st.total}</span></span>`:html`<span class="muted">—</span>`; }
    function ownerCell(p){ return html`<span class="ownc"><${Avatar} owner=${p.owner} cls="avm" /><span>${relName(p.owner)}</span></span>`; }

    var body=null;
    if(!es && pv==='table'){
      var groups=sort==='deadline'?[['Due in the next 2 weeks',function(p){ return p.end_date&&daysUntil(p.end_date)<=14; }],['Later',function(p){ return p.end_date&&daysUntil(p.end_date)>14; }],['No deadline',function(p){ return !p.end_date; }]]:[['',function(){return true;}]];
      body=html`<div class="ptbl">
        <div class="ptr pth"><span>Project</span><span>Next up</span><span>Progress</span><span>Deadline</span><span>Left</span><span>Owner</span><span></span></div>
        ${groups.map(function(g){ var rows=list.filter(g[1]); if(!rows.length) return null; return html`<${Fragment} key=${g[0]||'all'}>
          ${g[0]?html`<div class="ptgrp">${g[0]} · ${rows.length}</div>`:null}
          ${rows.map(function(p){ var lc=leftChip(p.end_date); return html`<div class="ptr" key=${p.id} onClick=${function(){props.onOpen(p.id);}}>
            <span class="ptn"><span class="dot" style=${{background:p.color}}></span><span><button type="button" class="pname2" onClick=${function(e){e.stopPropagation();props.onOpen(p.id);}}>${p.name||'Untitled project'}</button><span class="pkind">${kindLabel(p)}${p.archived?' · Finished':''}</span></span></span>
            <span class="ptc ptnext">${nextCell(p)}</span>
            <span class="ptc ptprog">${progCell(p)}</span>
            <span class="ptc ptdead tnum">${p.end_date?shortDate(p.end_date):html`<span class="muted">—</span>`}</span>
            <span class="ptc ptleft">${lc?html`<span class=${'pill '+lc.cls}>${lc.txt}</span>`:null}</span>
            <span class="ptc ptown">${ownerCell(p)}</span>
            <span class="ptc ptmore"><button type="button" class="kebab" aria-label=${'Edit '+p.name} onClick=${function(e){e.stopPropagation();props.onEdit(p);}}>${kebabGlyph}</button></span>
          </div>`; })}
        <//>`; })}
      </div>`;
    } else if(!es && pv==='lanes'){
      var lanes=[['Next 7 days',0,7],['Next 2 weeks',8,14],['Next 30 days',15,30],['Later',31,1e9],['No deadline',null,null]];
      body=html`<div class="lanes2">${lanes.map(function(L){ var rows=list.filter(function(p){ if(L[1]==null) return !p.end_date; if(!p.end_date) return false; var n=daysUntil(p.end_date); return L[1]===0?n<=7:(n>=L[1]&&n<=L[2]); }); if(L[1]==null&&!rows.length) return null;
        var sub=L[1]==null?'':(L[2]<1e9?('by '+shortDate(ymd(addDays(parseYmd(TODAY),L[2])))):('after '+shortDate(ymd(addDays(parseYmd(TODAY),30)))));
        return html`<section class="lane2" key=${L[0]} aria-label=${L[0]}><div class="lane2h"><span>${L[0]}</span><span class="lanec2">${rows.length}</span></div>${sub?html`<div class="lane2s">${sub}</div>`:null}
          ${rows.map(function(p){ var lc=leftChip(p.end_date), st=stats[p.id]; return html`<article class="lc2" key=${p.id} onClick=${function(){props.onOpen(p.id);}}>
            <div class="lc2h">${lc?html`<span class=${'pill '+lc.cls}>${shortDate(p.end_date)} · ${lc.txt}</span>`:html`<span class="pill">No deadline</span>`}<button type="button" class="kebab" aria-label=${'Edit '+p.name} onClick=${function(e){e.stopPropagation();props.onEdit(p);}}>${kebabGlyph}</button></div>
            <button type="button" class="lc2n" onClick=${function(e){e.stopPropagation();props.onOpen(p.id);}}><span class="dot" style=${{background:p.color}}></span>${p.name||'Untitled project'}</button>
            ${st.total?html`<div class="lc2p"><span class="pbar2"><i style=${{width:st.pct+'%'}}></i></span><span class="tnum">${st.done} of ${st.total}</span></div>`:null}
            <div class="lc2x">${nextCell(p)}</div>
            <div class="lc2f">${ownerCell(p)}</div>
          </article>`; })}
          ${rows.length?null:html`<p class="lane2e">Nothing due here.</p>`}
        </section>`; })}</div>`;
    } else if(!es && pv==='timeline'){
      var start=mondayOf(TODAY), N=84, s0=parseYmd(start);
      var pos=function(ds){ return ((parseYmd(ds)-s0)/86400000+0.5)/N*100; };
      var nowP=pos(TODAY), endDs=ymd(addDays(s0,N-1));
      var weeks=[]; for(var w=0;w<12;w++){ var wd=addDays(s0,w*7); weeks.push({l:(w===0||wd.getDate()<=7)?(MON[wd.getMonth()].slice(0,3)+' '+wd.getDate()):String(wd.getDate()),p:w/12*100}); }
      body=html`<div class="ptl"><div class="ptlin">
        <div class="ptlrow ptlhd"><div class="ptll"><span class="plab">${list.length} project${list.length===1?'':'s'} · by deadline</span></div><div class="ptlt">${weeks.map(function(wk){ return html`<span class="ptlwk" key=${wk.p} style=${{left:wk.p+'%'}}>${wk.l}</span>`; })}<span class="ptlnowl" style=${{left:nowP+'%'}}>Today</span></div></div>
        ${list.map(function(p){ var st=stats[p.id], ca=hexA(p.color||'#1F6FEB',.22); var lc=leftChip(p.end_date);
          var due=(tasks||[]).filter(function(t){ return t.project===p.id&&t.due&&!t.done&&t.due>=start&&t.due<=endDs; });
          var track;
          if(!p.end_date) track=html`<span class="ptlnone">No deadline</span>`;
          else if(p.end_date>endDs) track=html`<${Fragment}><span class="ptlrun" style=${{left:nowP+'%',right:0,background:'linear-gradient(90deg,'+ca+' 70%,rgba(255,255,255,0))'}}></span><span class="ptllab" style=${{right:'10px'}}>${shortDate(p.end_date)} · ${lc.txt} →</span><//>`;
          else if(p.end_date<start) track=html`<span class="ptllab" style=${{left:'8px'}}><span class="pill due over">${shortDate(p.end_date)} · ${lc.txt}</span></span>`;
          else { var e=pos(p.end_date), from=p.end_date<TODAY?e:nowP; track=html`<${Fragment}>${p.end_date>=TODAY?html`<span class="ptlrun" style=${{left:from+'%',width:Math.max(0,e-from)+'%',background:ca}}></span>`:null}<span class="ptldia" style=${{left:e+'%',background:p.end_date<TODAY?'#C64A3B':(p.color||'#1F6FEB')}}></span><span class=${'ptllab'+(e>78?' end':'')} style=${e>78?{right:(100-e+2)+'%'}:{left:'calc('+e+'% + 14px)'}}>${shortDate(p.end_date)} · ${lc.txt}</span><//>`; }
          return html`<div class="ptlrow" key=${p.id}>
            <div class="ptll"><span class="dot" style=${{background:p.color}}></span><button type="button" class="ptlname" onClick=${function(){props.onOpen(p.id);}}><span class="lname2">${p.name||'Untitled project'}</span><span class="pkind">${kindLabel(p)} · ${st.total?(st.done+' of '+st.total+' done'):'no tasks yet'}</span></button><${Avatar} owner=${p.owner} cls="avm" /></div>
            <div class="ptlt"><span class="ptlnow" style=${{left:nowP+'%'}}></span>${due.map(function(t){ return html`<span class="ptltd" key=${t.id} title=${t.title+' · due '+shortDate(t.due)} style=${{left:pos(t.due)+'%'}}></span>`; })}${track}</div>
          </div>`; })}
      </div></div>
      <div class="ptlkey"><span><i class="k1"></i>Time left, from today to the deadline</span><span><i class="k2"></i>Deadline</span><span><i class="k3"></i>A task due inside the project</span></div>`;
    } else if(!es){
      body=html`<div class="pgrid">${list.map(function(p){ var st=stats[p.id], lc=leftChip(p.end_date); return html`<article class="pc2" key=${p.id} onClick=${function(){props.onOpen(p.id);}}>
          <div class="lc2h">${lc?html`<span class=${'pill '+lc.cls}>${shortDate(p.end_date)} · ${lc.txt}</span>`:html`<span class="pill">No deadline</span>`}<button type="button" class="kebab" aria-label=${'Edit '+p.name} onClick=${function(e){e.stopPropagation();props.onEdit(p);}}>${kebabGlyph}</button></div>
          <div><button type="button" class="lc2n" onClick=${function(e){e.stopPropagation();props.onOpen(p.id);}}><span class="dot" style=${{background:p.color}}></span>${p.name||'Untitled project'}</button><div class="pkind">${kindLabel(p)}${p.archived?' · Finished':''}</div></div>
          ${st.total?html`<div class="lc2p"><span class="pbar2"><i style=${{width:st.pct+'%'}}></i></span><span class="tnum">${st.done} of ${st.total}</span></div>`:html`<div class="lc2p muted">No tasks yet</div>`}
          <div class="lc2x">${nextCell(p)}</div>
          <div class="lc2f">${ownerCell(p)}<span class="pcr">${st.total?((st.total-st.done)?((st.total-st.done)+' open'):'All done'):'—'}</span></div>
        </article>`; })}
        ${fstat!=='finished'?html`<button type="button" class="pnew" onClick=${props.onNew}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>New project<span>Give it a deadline, then tasks</span></button>`:null}
      </div>`;
    }
    return html`<${Fragment}>${toolbar}${summary}${es||body}<//>`;
  }

  // ---- inside a project: List · Table · Timeline ----
  function ProjectPage(props){
    var p=props.project, tasks=props.tasks, materials=props.materials;
    var tS=useState(lsGet('sp_ptab','list')); var tab=tS[0], setTabRaw=tS[1];
    function setTab(v){ setTabRaw(v); lsSet('sp_ptab',v); }
    var itemS=useState({title:'',due:''}); var ni=itemS[0], setNi=itemS[1];
    var matS=useState({title:'',url:''}); var nm=matS[0], setNm=matS[1];
    var subForS=useState(null); var subFor=subForS[0], setSubFor=subForS[1];
    var subS=useState({title:'',due:''}); var ns=subS[0], setNs=subS[1];
    var openS=useState({}); var openRows=openS[0], setOpenRows=openS[1];
    if(!p) return null;
    var items=(tasks||[]).filter(function(t){return t.project===p.id && !t.parent_id;});
    items.sort(function(a,b){ if(!!a.done!==!!b.done) return a.done?1:-1; var ak=a.due||a.date||'9999', bk=b.due||b.date||'9999'; return ak<bk?-1:ak>bk?1:0; });
    var mats=(materials||[]).filter(function(m){return m.project_id===p.id;});
    var st=projStats(p.id,tasks), lc=leftChip(p.end_date);
    function addTask(){ if(ni.title.trim()){ props.onAddItem(p.id,ni.title,ni.due); setNi({title:'',due:''}); } }
    var adder=html`<div class="addrow pgadd">
      <label class="sr" for="pg-add">Add a task to ${p.name}</label><input id="pg-add" class="grow" type="text" placeholder=${'Add a task to '+(p.name||'this project')} value=${ni.title} onInput=${function(e){setNi(Object.assign({},ni,{title:e.target.value}));}} onKeyDown=${function(e){ if(e.key==='Enter') addTask(); }} />
      <label class="sr" for="pg-add-due">Deadline</label><input id="pg-add-due" type="date" value=${ni.due} onInput=${function(e){setNi(Object.assign({},ni,{due:e.target.value}));}} />
      <button type="button" class="mini" onClick=${addTask}>Add</button>
    </div>`;
    var listView=html`<${Fragment}>
      <div class="psec">
        ${items.length===0?html`<p class="muted" style=${{fontSize:'13px',margin:'2px 0 8px'}}>No tasks yet. What's the first step?</p>`:null}
        ${items.map(function(it){ var subs=childrenOf(tasks,it.id); var sdone=subs.filter(function(s){return s.done;}).length; var c=soonChip(it.due);
          return html`<div class="irow" key=${it.id}>
            <${Check} done=${it.done} label=${it.title} onClick=${function(){props.onToggle(it);}} />
            <div class="ibody">
              <div class=${'ititle'+(it.done?' done':'')}><span class="stk">${it.title}</span></div>
              <div class="ameta">
                ${it.due?html`<span class=${'pill due'+(dueOver(it)?' over':'')}>Due ${shortDate(it.due)}${it.due_time?(' · '+to12(it.due_time)):''}</span>`:null}
                <button class="view" onClick=${function(){ setSubFor(subFor===it.id?null:it.id); setNs({title:'',due:''}); }}>${subs.length?(sdone+'/'+subs.length+' subtasks'):'+ subtask'}</button>
                <button class="view" onClick=${function(){props.onEditTask(it);}}>Edit</button>
              </div>
              ${subs.length?html`<div class="subs">${subs.map(function(s){return html`<div class=${'subrow'+(s.done?' done':'')} key=${s.id}><${Check} sm=${true} done=${s.done} label=${s.title} onClick=${function(){props.onToggle(s);}} /><span class="slabel"><span class="stk">${s.title}</span></span>${s.due?html`<span class=${'pill due'+(dueOver(s)?' over':'')}>${shortDate(s.due)}</span>`:null}</div>`;})}</div>`:null}
              ${subFor===it.id?html`<div class="addrow">
                <input class="grow" type="text" aria-label=${'Subtask of '+it.title} placeholder="Subtask" value=${ns.title} onInput=${function(e){setNs(Object.assign({},ns,{title:e.target.value}));}} />
                <input type="date" aria-label="Subtask deadline" value=${ns.due} onInput=${function(e){setNs(Object.assign({},ns,{due:e.target.value}));}} />
                <button class="mini" onClick=${function(){ if(ns.title.trim()){ props.onAddSub(it.id,p.id,ns.title,ns.due); setNs({title:'',due:''}); } }}>Add</button>
              </div>`:null}
            </div>
            <${Avatar} owner=${it.owner} cls="avm" />
          </div>`;
        })}
        ${adder}
      </div>
    <//>`;
    var tableView=html`<div class="pgt">
      <div class="pgr pgh"><span>Task</span><span>Owner</span><span>Due</span><span>Status</span><span>Subtasks</span><span></span></div>
      ${items.length===0?html`<div class="pgr pge"><span class="muted">No tasks yet. Add the first one below.</span></div>`:null}
      ${items.map(function(it){ var subs=childrenOf(tasks,it.id), sdone=subs.filter(function(s){return s.done;}).length, open=!!openRows[it.id]; var c=soonChip(it.due||it.date);
        var status=it.done?html`<span class="pill okp">Done${it.due&&it.done_at&&dayOfMs(it.done_at)<=it.due?' · on time':''}</span>`:(dueOver(it)||(it.date&&it.date<TODAY)?html`<span class="pill due over">Overdue</span>`:html`<span class="pill">To do</span>`);
        return html`<${Fragment} key=${it.id}>
          <div class="pgr">
            <span class="pgc"><${Check} done=${it.done} label=${it.title} onClick=${function(){props.onToggle(it);}} /><button type="button" class=${'pgtt'+(it.done?' done':'')} onClick=${function(){props.onEditTask(it);}}>${it.title}</button></span>
            <span class="pgc"><${Avatar} owner=${it.owner} cls="avm" /><span class="small">${relName(it.owner)}</span></span>
            <span class="pgc small tnum">${(it.due||it.date)?shortDate(it.due||it.date):html`<span class="muted">no date</span>`}${!it.done&&c?html`<span class=${'pill '+c.cls}>${c.txt}</span>`:null}</span>
            <span class="pgc">${status}</span>
            <span class="pgc">${subs.length?html`<button type="button" class="linkbtn inl" aria-expanded=${open} onClick=${function(){ var o=Object.assign({},openRows); o[it.id]=!open; setOpenRows(o); }}>${sdone} of ${subs.length} ${open?'▴':'▾'}</button>`:html`<span class="muted">—</span>`}</span>
            <span class="pgc"><button type="button" class="kebab" aria-label=${'Edit '+it.title} onClick=${function(){props.onEditTask(it);}}>${kebabGlyph}</button></span>
          </div>
          ${open?subs.map(function(s){ return html`<div class="pgr sub" key=${s.id}>
            <span class="pgc ind"><${Check} sm=${true} done=${s.done} label=${s.title} onClick=${function(){props.onToggle(s);}} /><span class=${s.done?'done':''}>${s.title}</span></span>
            <span class="pgc"><${Avatar} owner=${s.owner} cls="avm" /><span class="small">${relName(s.owner)}</span></span>
            <span class="pgc small tnum">${s.due?shortDate(s.due):html`<span class="muted">no date</span>`}</span>
            <span class="pgc">${s.done?html`<span class="pill okp">Done</span>`:(dueOver(s)?html`<span class="pill due over">Overdue</span>`:html`<span class="pill">To do</span>`)}</span>
            <span class="pgc muted">—</span><span class="pgc"></span>
          </div>`; }):null}
        <//>`; })}
      ${adder}
    </div>`;
    return html`<div class="ppage">
      <div class="pcrumb"><button type="button" class="linkbtn inl" onClick=${props.onBack}>Projects</button><span aria-hidden="true">/</span><span>${p.name}</span></div>
      <div class="pghd">
        <div class="pgt1"><span class="dot" style=${{background:p.color,width:'12px',height:'12px'}}></span><h2 class="pgname">${p.name}</h2><span class="pill">${kindLabel(p)}</span>${p.archived?html`<span class="pill okp">Finished</span>`:null}</div>
        <div class="pgact"><button type="button" class="btn ghost pgb" onClick=${function(){props.onEdit(p);}}>Edit</button>${p.archived?html`<button type="button" class="btn ghost pgb" onClick=${function(){props.onReopen(p.id);}}>Reopen</button>`:html`<button type="button" class="btn ghost pgb" onClick=${function(){props.onFinish(p);}}>Finish project</button>`}</div>
      </div>
      <div class="facts2">
        <div class="fact2"><span class="fk2">Deadline</span><span class="fv2 tnum">${p.end_date?shortDate(p.end_date):'—'}</span></div>
        <div class="fact2"><span class="fk2">Left</span><span class="fv2">${lc?html`<span class=${'pill '+lc.cls}>${lc.txt}</span>`:'—'}</span></div>
        <div class="fact2"><span class="fk2">Done</span><span class="fv2 tnum">${st.total?html`<span class="pbar2" style=${{width:'96px'}}><i style=${{width:st.pct+'%'}}></i></span>`:null}${st.total?(st.done+' of '+st.total):'No tasks yet'}</span></div>
        <div class="fact2"><span class="fk2">Owner</span><span class="fv2"><${Avatar} owner=${p.owner} cls="avm" />${relName(p.owner)}</span></div>
      </div>
      <div class="pgtabs"><div class="segc" role="group" aria-label="View">${[['list','List'],['table','Table'],['timeline','Timeline']].map(function(x){ return html`<button type="button" key=${x[0]} class=${tab===x[0]?'on':''} aria-pressed=${tab===x[0]} onClick=${function(){setTab(x[0]);}}>${x[1]}</button>`; })}</div></div>
      ${tab==='timeline'?html`<${ProjectTimeline} project=${p} tasks=${tasks} />`:(tab==='table'?tableView:listView)}
      <div class="psec">
        <h4>Materials${mats.length?html` · ${mats.length}`:''}</h4>
        ${mats.length===0?html`<p class="muted" style=${{fontSize:'13px',margin:'2px 0'}}>No links yet.</p>`:null}
        ${mats.map(function(m){ return html`<div class="matrow" key=${m.id}>
          <span style=${{color:'#AEB6C1'}}>🔗</span>
          <a href=${m.url} target="_blank" rel="noreferrer noopener">${m.title||m.url}</a>
          <button class="x" aria-label=${'Remove '+(m.title||m.url)} onClick=${function(){props.onDelMaterial(m);}}>×</button>
        </div>`; })}
        <div class="addrow">

  // swap one solid colour in a Lottie for another (handles static + keyframed fills/strokes), leaving other colours (e.g. the black face/eyes) alone
  function recolorLottie(data,from,to){
